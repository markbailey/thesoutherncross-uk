name: Update Playwright Snapshots

# Manual snapshot regeneration. Runs Playwright with --update-snapshots against
# the chosen ref, then opens a PR with the resulting PNG changes. Designed for
# the bootstrap case (no baselines in the repo yet) and ongoing re-baselines
# after intentional layout changes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to update snapshots against (also the PR target).'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-snapshots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Update snapshots
        # Playwright reports tests as passing when --update-snapshots writes a
        # baseline, so a clean run still exits 0. We don't `|| true` this — a
        # real test failure (non-snapshot) should still abort the workflow.
        run: npx playwright test --update-snapshots

      - name: Detect snapshot changes
        id: changes
        shell: bash
        run: |
          # Capture added/modified PNGs under tests/visual/. Playwright's default
          # snapshot path template is {testFileDir}/{testFileName}-snapshots/{arg}{ext},
          # so baselines land in per-spec subdirectories under tests/visual/.
          # `git status --porcelain` recurses, so this picks them up.
          mapfile -t CHANGED < <(git status --porcelain tests/visual/ | awk '/\.png$/ {print $2}')
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "No snapshot changes — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${CHANGED[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Snapshot changes (${#CHANGED[@]} files):"
          printf '  %s\n' "${CHANGED[@]}"

      - name: Commit, push, and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH="snapshots/update-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Stage the snapshot directory only — never `git add .` or `-A`.
          # Recursive add picks up baselines in per-spec subdirectories
          # (tests/visual/<spec>-snapshots/<arg>-<project>.png).
          git add tests/visual/
          git commit -m "chore: update playwright snapshots [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --base "${{ inputs.ref }}" \
            --head "$BRANCH" \
            --title "chore: update playwright snapshots" \
            --body "$(cat <<BODY
          Automated snapshot regeneration triggered by @${{ github.actor }} via \`workflow_dispatch\` on run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Inspect the PNG diffs in the **Files changed** tab before merging — these become the source of truth for future \`toHaveScreenshot\` assertions.

          ### Changed files
          \`\`\`
          ${{ steps.changes.outputs.files }}
          \`\`\`
          BODY
          )"
