name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Detect bump type
        id: bump
        shell: bash
        run: |
          MSG="$(git log -1 --pretty=%B)"
          TYPE="$(COMMIT_MESSAGE="$MSG" node ./scripts/detect-bump.mjs)"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Bump version in package files
        id: version
        run: |
          npm version "${{ steps.bump.outputs.type }}" --no-git-tag-version
          echo "new=$(npm pkg get version | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Build zip
        run: npm run build:zip

      - name: Commit, tag, and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${{ steps.version.outputs.new }} [skip ci]"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin main --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.new }}" deploy.zip \
            --title "v${{ steps.version.outputs.new }}" \
            --generate-notes
